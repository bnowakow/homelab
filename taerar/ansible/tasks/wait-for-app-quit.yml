# Ensure an app is not running before its settings are copied.
# Only the current user's processes count (another logged-in user may run
# the same app). Variables: quit_process (pgrep -x name), quit_app_name (shown to the user),
# quit_attempt (starts at 1). While the app runs, ask the user to quit it and
# confirm, then check again; Abort (the default) or a missing terminal stops.
# The first dialog also offers "Quit it for me" (a normal quit request); when
# the app is still running afterwards, the button becomes "Force quit it"
# (SIGTERM, then SIGKILL), which can lose unsaved work. A fourth button, "Skip
# copy", sets quit_skip_copy so the caller leaves this copy out (nothing is saved:
# the question is asked again on the next run).
- name: "Check that {{ quit_app_name }} is not running"
  ansible.builtin.shell: 'pgrep -x -u "$(id -u)" "$PROCESS"'
  environment:
    PROCESS: "{{ quit_process }}"
  register: quit_check
  changed_when: false
  failed_when: false

- name: "Ask to quit {{ quit_app_name }} and confirm"
  ansible.builtin.shell: |
    if [ "$ATTEMPT" -ge 2 ]; then
      extra="Force quit it"
      hint="It is still running. Force quit ends it immediately and can lose unsaved work. \"Skip copy\" leaves this copy out for now."
    else
      extra="Quit it for me"
      hint="Quit it yourself (Cmd+Q) and choose \"I quit it\" to check again, or let provisioning ask it to quit. \"Skip copy\" leaves this copy out for now."
    fi
    dialog --clear --stdout --cr-wrap --title "Quit $APP_NAME" \
      --yes-label "I quit it" --no-label Abort \
      --extra-button --extra-label "$extra" --help-button --help-label "Skip copy" --default-button no \
      --yesno "$APP_NAME is running. It keeps its data open and rewrites it when it closes, which would conflict with the copied data.\n\n$hint" 12 78 \
      < "$PROVISION_TTY" 2> "$PROVISION_TTY"
  args:
    executable: /bin/bash
  environment:
    APP_NAME: "{{ quit_app_name }}"
    ATTEMPT: "{{ quit_attempt }}"
    PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
    TERM: "{{ lookup('env', 'TERM') or 'xterm-256color' }}"
    DIALOG_ERROR: '70'
    DIALOG_HELP: '2'
  register: quit_answer
  changed_when: false
  failed_when: false
  when: quit_check.rc == 0

- name: "Quit {{ quit_app_name }} at the user's request"
  ansible.builtin.shell: |
    if [ "$ATTEMPT" -ge 2 ]; then
      pkill -x -u "$(id -u)" "$PROCESS" || true
      for _ in 1 2 3 4 5; do pgrep -x -u "$(id -u)" "$PROCESS" >/dev/null || exit 0; sleep 1; done
      pkill -KILL -x -u "$(id -u)" "$PROCESS" || true
      sleep 1
    else
      osascript -e 'on run argv' -e 'tell application (item 1 of argv) to quit' -e 'end run' "$APP_NAME" || true
      for _ in $(seq 1 15); do pgrep -x -u "$(id -u)" "$PROCESS" >/dev/null || exit 0; sleep 1; done
    fi
  args:
    executable: /bin/bash
  environment:
    APP_NAME: "{{ quit_app_name }}"
    PROCESS: "{{ quit_process }}"
    ATTEMPT: "{{ quit_attempt }}"
  changed_when: true
  failed_when: false
  when: quit_check.rc == 0 and quit_answer.rc == 3

- name: "Stop while {{ quit_app_name }} keeps running"
  ansible.builtin.fail:
    msg: >-
      {{ quit_app_name }} is running. Quit it (Cmd+Q) so its settings are not overwritten
      when it closes, then rerun provisioning. Your answers are saved.
  when: >-
    quit_check.rc == 0 and
    (quit_answer.rc not in [0, 2, 3] or quit_attempt | int >= 10)

- name: "Skip this copy because {{ quit_app_name }} keeps running"
  ansible.builtin.set_fact:
    quit_skip_copy: true
  when: quit_check.rc == 0 and quit_answer.rc == 2

- name: Count the attempt
  ansible.builtin.set_fact:
    quit_next_attempt: "{{ quit_attempt | int + 1 }}"
  when: quit_check.rc == 0 and quit_answer.rc != 2

- name: "Check {{ quit_app_name }} again"
  ansible.builtin.include_tasks: wait-for-app-quit.yml
  vars:
    quit_attempt: "{{ quit_next_attempt }}"
  when: quit_check.rc == 0 and quit_answer.rc != 2
