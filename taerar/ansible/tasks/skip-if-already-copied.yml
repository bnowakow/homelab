# Offer to skip a backup copy that already finished for the same backup bundle.
# Variables: copied_step (copy_status.py step name), copied_label (shown to the user),
# copied_bundle (e.g. "Taerar 7.5.sparsebundle"), copied_mode (PROD or TEST).
# Sets copied_skip: true only when the step finished before for that bundle (a later
# interrupted or failed rerun still counts) and the user chose Skip. Nothing is saved: the question is asked again on the next run. Copies
# never overwrite files, so "Copy again" is always safe; it only costs the slow attach.
# Abort is the default button (repo rule); Abort or Esc stops provisioning. A missing dialog or terminal, or any other dialog error,
# means "Copy again" (silence is never approval).
- name: "Look up an earlier finished copy of {{ copied_label }}"
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/files/copy_status.py"
      - done
      - "{{ copied_step }}"
      - "{{ copied_bundle }}"
      - "{{ copied_mode }}"
  environment:
    PYTHONDONTWRITEBYTECODE: '1'
  register: copied_lookup
  changed_when: false
  failed_when: false

- name: "Ask whether to skip copying {{ copied_label }} again"
  ansible.builtin.shell: |
    backup="${LAST%%|*}"; when="${LAST#*|}"
    dialog --clear --stdout --cr-wrap --title "Copy $LABEL again?" \
      --yes-label "Skip it" --no-label "Copy again" --extra-button --extra-label Abort \
      --default-button extra \
      --yesno "$LABEL was already copied from $BUNDLE (backup $backup) on $when.\n\nCopying again attaches the backup (slow over the network) and only adds files that are still missing; nothing is overwritten. Skipping does not pick up a newer backup." 13 78 \
      < "$PROVISION_TTY" 2> "$PROVISION_TTY"
  args:
    executable: /bin/bash
  environment:
    LABEL: "{{ copied_label }}"
    BUNDLE: "{{ copied_bundle }}"
    LAST: "{{ copied_lookup.stdout | trim }}"
    PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
    TERM: "{{ lookup('env', 'TERM') or 'xterm-256color' }}"
    DIALOG_ERROR: '70'
    DIALOG_ESC: '255'
  register: copied_answer
  changed_when: false
  failed_when: false
  when: copied_lookup.rc == 0 and (copied_lookup.stdout | trim | length) > 0

- name: "Stop when the copy of {{ copied_label }} was aborted"
  ansible.builtin.fail:
    msg: >-
      Provisioning aborted at the copy of {{ copied_label }}. Nothing was copied by this step;
      earlier steps and your saved answers remain. Rerun provisioning to continue.
  when: not (copied_answer.skipped | default(false)) and copied_answer.rc in [3, 255]

- name: "Remember whether to skip {{ copied_label }}"
  ansible.builtin.set_fact:
    copied_skip: "{{ (copied_answer.rc | default(1)) == 0 and not (copied_answer.skipped | default(false)) }}"

- name: "Say that {{ copied_label }} is skipped"
  ansible.builtin.debug:
    msg: "Skipped copying {{ copied_label }}: it was already copied from this backup. Rerun and choose Copy again to copy it again."
  when: copied_skip | bool
