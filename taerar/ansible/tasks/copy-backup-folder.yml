# One home folder from the selected backup. Variables: folder_name, folder_index
# (0-based), time_machine_copy_folders, folders_env, folders_source_bundle, rsync_install.
# When ~/<folder_name> was already copied from this bundle, ask whether to skip it
# (tasks/skip-if-already-copied.yml) before the slow backup attach; the copy itself is
# in copy-backup-folder-run.yml.
- name: "Offer to skip ~/{{ folder_name }} when it was already copied"
  ansible.builtin.include_tasks: skip-if-already-copied.yml
  vars:
    copied_step: "folder:{{ folder_name }}"
    copied_label: "~/{{ folder_name }}"
    copied_bundle: "{{ folders_source_bundle | basename }}"
    copied_mode: "{{ folders_env }}"

- name: "Copy ~/{{ folder_name }} ({{ folder_index | int + 1 }} of {{ time_machine_copy_folders | length }})"
  ansible.builtin.include_tasks: copy-backup-folder-run.yml
  when: not (copied_skip | default(false) | bool)
