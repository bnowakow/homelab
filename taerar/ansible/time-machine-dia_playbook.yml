- name: Optionally copy the Dia browser configuration from the selected Time Machine backup
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    time_machine_volume: /Volumes/time-machine
    # PROD copies Dia's plain configuration files; TEST copies only Preferences.
    dia_env: "{{ provision_env | default('PROD') }}"
    dia_source_bundle: >-
      {{ time_machine_volume }}/{{ time_machine_computer | default('') }}{{
      '' if (time_machine_copy_from | default('none')) == 'unversioned'
      else ' ' + (time_machine_copy_from | default('none') | string) }}.sparsebundle
  pre_tasks:
    # Asked only after the wizard has a copy source; never for cancelled or
    # TODO paths, and never when the user chose to start with an empty backup.
    - name: Skip unless a backup to copy data from was selected
      ansible.builtin.meta: end_play
      when: >-
        (time_machine_action | default('cancelled')) != 'create' or
        (time_machine_copy_from | default(none)) in [none, 'none'] or
        (time_machine_saved_cancelled | default(false))

    # The user chose "Continue without" in full-disk-access_playbook.yml.
    - name: Explain that Dia configuration is not copied without Full Disk Access
      ansible.builtin.debug:
        msg: >-
          Skipped copying Dia configuration: {{ full_disk_access_app | default('the terminal app') }}
          has no Full Disk Access. Enable it, quit and reopen the app, then rerun
          provisioning. Your saved answers are unchanged.
      when: not (provision_full_disk_access | default(true) | bool)

    - name: Skip the Dia copy without Full Disk Access
      ansible.builtin.meta: end_play
      when: not (provision_full_disk_access | default(true) | bool)
  tasks:
    - name: Validate the provisioning environment
      ansible.builtin.assert:
        that: dia_env in ['PROD', 'TEST']
        fail_msg: HOMELAB_PROVISION_ENV must be PROD or TEST.

    - name: Check that Dia is installed
      ansible.builtin.shell: '[[ -d /Applications/Dia.app || -d "$HOME/Applications/Dia.app" ]]'
      args:
        executable: /bin/bash
      register: dia_present
      changed_when: false
      failed_when: false

    - name: Explain that Dia is not installed
      ansible.builtin.debug:
        msg: Skipped copying Dia configuration because Dia is not installed.
      when: dia_present.rc != 0

    - name: Skip when Dia is not installed
      ansible.builtin.meta: end_play
      when: dia_present.rc != 0

    - name: Ask whether to copy the Dia configuration from the selected backup
      ansible.builtin.shell: |
        if [ "$DIA_ENV" = TEST ]; then
          scope='TEST environment: only the main Preferences file is copied.'
        else
          scope='Preferences, bookmarks, extensions and their settings, and the Dia app preferences are copied.'
        fi
        message="Copy Dia browser settings from the latest backup in $SOURCE_NAME to this Mac?\n\n$scope\n\nNot copied: history, cookies, saved logins, autofill and caches, plus Dia's own encrypted data, which cannot be read on another Mac (sign in to Dia to sync it). Existing files are never overwritten, and the backup is only read.\n\nThe terminal running provisioning needs Full Disk Access to read backup contents."
        dialog --clear --stdout --cr-wrap --title 'Copy Dia configuration from backup' \
          --ok-label Continue --cancel-label Abort --default-button cancel \
          --menu "$message" 22 80 2 \
          copy "Copy Dia settings from $SOURCE_NAME" \
          skip 'Do not copy Dia settings' \
          < "$PROVISION_TTY" 2> "$PROVISION_TTY"
      args:
        executable: /bin/bash
      environment:
        DIA_ENV: "{{ dia_env }}"
        SOURCE_NAME: "{{ dia_source_bundle | basename | regex_replace('\\.sparsebundle$', '') }}"
        PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
        TERM: "{{ lookup('env', 'TERM') or 'xterm-256color' }}"
        DIALOG_ERROR: '70'
        DIALOG_CANCEL: '1'
        DIALOG_ESC: '255'
      register: dia_answer
      changed_when: false
      failed_when: false
      when: "'time_machine.dia' not in (provision_saved_answers | default({}))"

    - name: Stop after Abort or a dialog failure
      ansible.builtin.fail:
        msg: >-
          {{ 'Copying Dia configuration cancelled. Nothing was copied; earlier provisioning steps remain applied.'
             if dia_answer.rc in [1, 255] else
             'Could not show the Dia dialog. Run provisioning from an interactive Terminal.' }}
      when: not (dia_answer.skipped | default(false)) and dia_answer.rc != 0

    - name: Decide whether to copy the Dia configuration
      ansible.builtin.set_fact:
        time_machine_copy_dia: >-
          {{ (provision_saved_answers['time_machine.dia'] | default('skip'))
             if (dia_answer.skipped | default(false)) else dia_answer.stdout }}

    - name: Validate the Dia choice
      ansible.builtin.assert:
        that: time_machine_copy_dia in ['copy', 'skip']
        fail_msg: No valid Dia copy choice was selected.

    - name: Remember the Dia choice
      ansible.builtin.include_tasks: tasks/save-wizard-answer.yml
      vars:
        wizard_answer_key: time_machine.dia
        wizard_answer_value: "{{ time_machine_copy_dia }}"
      when: not (dia_answer.skipped | default(false))

    # A running browser rewrites its settings when it quits, so copy only while
    # it is closed.
    - name: Check that Dia is not running
      ansible.builtin.command: pgrep -x Dia
      register: dia_running
      changed_when: false
      failed_when: false
      when: time_machine_copy_dia == 'copy'

    - name: Ask to quit Dia before copying its settings
      ansible.builtin.fail:
        msg: >-
          Dia is running. Quit Dia (Cmd+Q) so its settings are not overwritten when it
          closes, then rerun provisioning. Your answers are saved.
      when: time_machine_copy_dia == 'copy' and dia_running.rc == 0

    - name: Install Homebrew rsync for copying files from backups
      ansible.builtin.include_tasks: tasks/install-rsync.yml
      when: time_machine_copy_dia == 'copy'

    - name: Copy the Dia configuration from the latest backup without overwriting files
      ansible.builtin.shell: >-
        {{ ansible_playbook_python | quote }}
        {{ (playbook_dir + '/files/copy_time_machine_downloads.py') | quote }}
        --dia
        {{ dia_source_bundle | quote }}
        {{ lookup('env', 'HOME') | quote }}
        {{ (lookup('env', 'HOME') + '/.homelab-provision-state/time-machine-dia.jsonl') | quote }}
        {{ dia_env | quote }}
        < "$PROVISION_TTY" 2> >(tee "$PROVISION_TTY" >&2)
      args:
        executable: /bin/bash
      environment:
        PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
        PYTHONDONTWRITEBYTECODE: '1'
        HOMELAB_RSYNC: "{{ (rsync_install.stdout_lines | select('match', '^rsync=') | first)[6:] }}"
      register: dia_copy
      # The helper prints its JSON summary only on success; its error message
      # was already shown in the terminal above.
      changed_when: dia_copy.rc == 0 and (dia_copy.stdout | from_json).copied > 0
      failed_when: false
      when: time_machine_copy_dia == 'copy'

    - name: Stop with a short explanation when copying failed
      ansible.builtin.fail:
        msg: >-
          Copying Dia configuration failed: {{ (dia_copy.stderr_lines | default([]) | last)
          | default('see the message printed above this task.', true) }}
          The backup was only read and nothing was overwritten. Earlier steps and
          your saved answers remain; fix the problem and rerun provisioning.
      when: time_machine_copy_dia == 'copy' and dia_copy.rc != 0

    - name: Report the Dia copy
      ansible.builtin.debug:
        msg: >-
          {{ dia_env }}: copied {{ (dia_copy.stdout | from_json).copied }} Dia configuration file(s) from
          backup {{ (dia_copy.stdout | from_json).backup }}; skipped
          {{ (dia_copy.stdout | from_json).skipped_existing }} that already existed.
          Files Dia already created are never overwritten. Undo removes only the copied
          files that are still unchanged.
      when: time_machine_copy_dia == 'copy'
