- name: Ask whether to copy Finder, Dock and system settings from the selected backup
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    time_machine_volume: /Volumes/time-machine
    # PROD copies ~/.ssh, fonts, login items, services, scripts and the Finder sidebar; TEST copies one file.
    files_env: "{{ provision_env | default('PROD') }}"
    files_source_bundle: >-
      {{ time_machine_volume }}/{{ time_machine_computer | default('') }}{{
      '' if (time_machine_copy_from | default('none')) == 'unversioned'
      else ' ' + (time_machine_copy_from | default('none') | string) }}.sparsebundle
  pre_tasks:
    # Asked only after the wizard has a copy source; never for cancelled or
    # TODO paths, and never when the user chose to start with an empty backup.
    - name: Skip unless a backup to copy data from was selected
      ansible.builtin.meta: end_play
      when: >-
        (time_machine_action | default('cancelled')) != 'create' or
        (time_machine_copy_from | default(none)) in [none, 'none'] or
        (time_machine_saved_cancelled | default(false))

    # The user chose "Continue without" in full-disk-access_playbook.yml.
    - name: Explain that user files are not copied without Full Disk Access
      ansible.builtin.debug:
        msg: >-
          Skipped copying user files: {{ full_disk_access_app | default('the terminal app') }}
          has no Full Disk Access. Enable it, quit and reopen the app, then rerun
          provisioning to copy them. Your saved answers are unchanged.
      when: not (provision_full_disk_access | default(true) | bool)

    - name: Skip the user files copy without Full Disk Access
      ansible.builtin.meta: end_play
      when: not (provision_full_disk_access | default(true) | bool)
  tasks:
    - name: Validate the provisioning environment
      ansible.builtin.assert:
        that: files_env in ['PROD', 'TEST']
        fail_msg: HOMELAB_PROVISION_ENV must be PROD or TEST.

    - name: Ask whether to copy apps and preferences from the selected backup
      ansible.builtin.shell: |
        if [ "$FILES_ENV" = TEST ]; then
          scope='TEST environment: only one small file (~/.ssh/known_hosts when present) is copied.'
        else
          scope='Copies ~/.ssh (including private keys), ~/Library/Fonts, LaunchAgents (login items; they are not loaded), Services and Scripts, dotfiles that make install-dotfiles does not install (.zsh_history, .config, .docker, .kube, .cursor, .codex, .claude, .gradle, .m2, .aws, .gnupg and others), and replaces the Finder sidebar favorites.'
        fi
        message="Copy user files from the latest backup in $SOURCE_NAME into this Mac?\n\n$scope Existing files are never overwritten (except the sidebar, which is saved first), and the backup is only read.\n\nThe terminal running provisioning needs Full Disk Access (System Settings > Privacy & Security > Full Disk Access) to read backup contents."
        dialog --clear --stdout --cr-wrap --title 'Copy user files from backup' \
          --ok-label Continue --cancel-label Abort --default-button cancel \
          --menu "$message" 18 80 2 \
          copy "Merge user files from $SOURCE_NAME" \
          skip 'Do not copy user files' \
          < "$PROVISION_TTY" 2> "$PROVISION_TTY"
      args:
        executable: /bin/bash
      environment:
        FILES_ENV: "{{ files_env }}"
        SOURCE_NAME: "{{ files_source_bundle | basename | regex_replace('\\.sparsebundle$', '') }}"
        PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
        TERM: "{{ lookup('env', 'TERM') or 'xterm-256color' }}"
        DIALOG_ERROR: '70'
        DIALOG_CANCEL: '1'
        DIALOG_ESC: '255'
      register: files_answer
      changed_when: false
      failed_when: false
      when: "'time_machine.user_files' not in (provision_saved_answers | default({}))"

    - name: Stop after Abort or a dialog failure
      ansible.builtin.fail:
        msg: >-
          {{ 'Copying user files cancelled. Nothing was copied; earlier provisioning steps remain applied.'
             if files_answer.rc in [1, 255] else
             'Could not show the user files dialog. Run provisioning from an interactive Terminal.' }}
      when: not (files_answer.skipped | default(false)) and files_answer.rc != 0

    - name: Decide whether to copy user files
      ansible.builtin.set_fact:
        time_machine_copy_files: >-
          {{ (provision_saved_answers['time_machine.user_files'] | default('skip'))
             if (files_answer.skipped | default(false)) else files_answer.stdout }}

    - name: Validate the user files choice
      ansible.builtin.assert:
        that: time_machine_copy_files in ['copy', 'skip']
        fail_msg: No valid user files copy choice was selected.

    - name: Remember the user files choice
      ansible.builtin.include_tasks: tasks/save-wizard-answer.yml
      vars:
        wizard_answer_key: time_machine.user_files
        wizard_answer_value: "{{ time_machine_copy_files }}"
      when: not (files_answer.skipped | default(false))
