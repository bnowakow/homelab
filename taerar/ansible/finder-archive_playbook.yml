- name: Guide Finder connection to the Time Machine share
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  pre_tasks:
    - name: Skip setup when saved choices were reused or review was cancelled
      ansible.builtin.meta: end_play
      when: (time_machine_reuse_choices | default(false)) or (time_machine_saved_cancelled | default(false))
  tasks:
    - name: Copy the archive address and wait for Finder setup confirmation
      ansible.builtin.shell: |
        set -euo pipefail
        address='smb://nas.localdomain.bnowakowski.pl/time-machine'
        printf '%s' "$address" | pbcopy
        dialog --clear --title 'Connect Finder to the Time Machine share' --defaultno \
          --yes-label 'Confirm' --no-label 'Abort' \
          --yesno "1. Open Finder.\n\n2. Press Cmd+K (Go > Connect to Server).\n\n3. Server address (already copied to your clipboard):\n\n$address\n\n4. Paste it with Cmd+V, press the + icon to save it, then press Connect. Complete any NAS sign-in prompt.\n\n5. Select Confirm once done, or Abort to stop provisioning." \
          23 88 < "$PROVISION_TTY" > "$PROVISION_TTY" 2>&1
      args:
        executable: /bin/bash
      environment:
        PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
        TERM: "{{ lookup('env', 'TERM') or 'xterm-256color' }}"
      changed_when: false
      when: not ((provision_saved_answers | default({})).get('finder.time_machine_connected', false))
      register: finder_connection_answer

    - name: Remember Finder connection confirmation
      ansible.builtin.include_tasks: tasks/save-wizard-answer.yml
      vars:
        wizard_answer_key: finder.time_machine_connected
        wizard_answer_value: true
      when: not (finder_connection_answer.skipped | default(false))
