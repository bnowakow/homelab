- name: Guide Finder connection to the Time Machine share
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    time_machine_volume: /Volumes/time-machine
  pre_tasks:
    - name: Skip setup when review was cancelled
      ansible.builtin.meta: end_play
      when: time_machine_saved_cancelled | default(false)

    - name: Check whether the Time Machine share is mounted
      ansible.builtin.shell: |
        # The share only counts when it comes from the NAS address of the current
        # location (local or remote); one mounted from the other address is "wrong-host".
        line=$(mount | grep -F " on $VOLUME (smbfs" || true)
        if [[ -z "$line" ]]; then echo missing
        elif [[ "$line" == *"@nas.$NAS_DOMAIN/"* || "$line" == "//nas.$NAS_DOMAIN/"* ]]; then echo mounted
        else echo wrong-host; fi
      args:
        executable: /bin/bash
      environment:
        VOLUME: "{{ time_machine_volume }}"
        NAS_DOMAIN: "{{ nas_domain | default('localdomain.bnowakowski.pl') }}"
      register: finder_share_state
      changed_when: false

    # A reused completed selection does not need the share unless a later step
    # reads a backup from it (copying ~/Downloads or Dia settings, not both declined).
    - name: Skip when the share is mounted or no remaining step needs it
      ansible.builtin.meta: end_play
      when: >-
        finder_share_state.stdout == 'mounted' or
        ((time_machine_reuse_choices | default(false)) and
         ((time_machine_copy_from | default('none')) in [none, 'none'] or
          ((provision_saved_answers | default({})).get('time_machine.folders', none) == [] and
           (provision_saved_answers | default({})).get('time_machine.dia') == 'skip' and
           (provision_saved_answers | default({})).get('time_machine.apps') == 'skip' and
           (provision_saved_answers | default({})).get('time_machine.settings') == 'skip' and
           (provision_saved_answers | default({})).get('time_machine.user_files') == 'skip' and
           (provision_saved_answers | default({})).get('time_machine.private_data') == 'skip' and
           (provision_saved_answers | default({})).get('time_machine.dia_extensions') == 'skip')))
  tasks:
    - name: Copy the archive address and wait until Finder has mounted the share
      ansible.builtin.shell: |
        set -euo pipefail
        address="smb://nas.$NAS_DOMAIN/time-machine"
        note=
        # A saved confirmation never replaces this live check. Compare captured
        # output: with pipefail, mount | grep -q can fail when grep exits early.
        share_mounted() {
          local line
          line=$(mount | grep -F " on $VOLUME (smbfs" || true)
          [[ "$line" == *"@nas.$NAS_DOMAIN/"* || "$line" == "//nas.$NAS_DOMAIN/"* ]]
        }
        # Mounted from the address of the other location (for example Tailscale after
        # coming home): detach a kept backup image, then unmount so it is mounted again.
        if ! share_mounted && mount | grep -qF " on $VOLUME (smbfs"; then
          printf 'The share at %s is connected through another NAS address than smb://nas.%s. Detaching the backup and reconnecting...\n' "$VOLUME" "$NAS_DOMAIN" > "$PROVISION_TTY"
          "$PYTHON" "$DETACH_SCRIPT" --detach > /dev/null 2>&1 || true
          # Each attempt is limited to 30 seconds: a dead Tailscale connection can make
          # a normal unmount hang. The share is a read-only source, so forcing is safe.
          limited() { perl -e 'alarm shift; exec @ARGV' 30 "$@" > /dev/null 2>&1 || true; }
          limited diskutil unmount "$VOLUME"
          if mount | grep -qF " on $VOLUME (smbfs"; then limited diskutil unmount force "$VOLUME"; fi
          if mount | grep -qF " on $VOLUME (smbfs"; then limited umount -f "$VOLUME"; fi
          if mount | grep -qF " on $VOLUME (smbfs"; then
            note="The share at $VOLUME is still connected through another NAS address and even a forced unmount failed (is the backup image still attached? see hdiutil info). Eject it in Finder (or run: diskutil unmount force $VOLUME), then choose Confirm to continue or Abort to stop.\n\n"
          fi
        fi
        # Try to mount it automatically first: `open smb://...` makes Finder mount
        # the share with the Keychain sign-in saved for it, and macOS itself asks for
        # the NAS password when none is saved (typed by you, never by this
        # script). Only when the share is still missing does the manual Finder
        # guide below appear.
        if ! share_mounted; then
          printf 'Mounting %s ...\n' "$address" > "$PROVISION_TTY"
          open "$address" > /dev/null 2>&1 || true
          for _ in $(seq 1 90); do
            if share_mounted; then break; fi
            sleep 1
          done
        fi
        while ! share_mounted; do
          printf '%s' "$address" | pbcopy
          dialog --clear --title 'Connect Finder to the Time Machine share' --defaultno \
            --yes-label 'Confirm' --no-label 'Abort' \
            --yesno "${note}1. Open Finder.\n\n2. Press Cmd+K (Go > Connect to Server).\n\n3. Server address (already copied to your clipboard):\n\n$address\n\n4. Paste it with Cmd+V, press the + icon to save it, then press Connect. Complete any NAS sign-in prompt.\n\n5. Select Confirm once done, or Abort to stop provisioning." \
            25 88 < "$PROVISION_TTY" > "$PROVISION_TTY" 2>&1
          note="Automatic mounting did not work and the share is not mounted at $VOLUME yet. If Finder shows it under another name (e.g. time-machine-1), eject it and connect again.\n\n"
        done
      args:
        executable: /bin/bash
      environment:
        PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
        TERM: "{{ lookup('env', 'TERM') or 'xterm-256color' }}"
        VOLUME: "{{ time_machine_volume }}"
        NAS_DOMAIN: "{{ nas_domain | default('localdomain.bnowakowski.pl') }}"
        PYTHON: "{{ ansible_playbook_python }}"
        DETACH_SCRIPT: "{{ playbook_dir }}/files/copy_time_machine_downloads.py"
      changed_when: false
      failed_when: false
      register: finder_connection_answer

    - name: Stop cleanly after Abort or a dialog failure
      ansible.builtin.fail:
        msg: >-
          {{ 'Provisioning aborted at the Finder connection step. Earlier steps and saved answers remain.'
             if finder_connection_answer.rc in [1, 255] else
             'Could not show the Finder connection dialog. Run provisioning from an interactive Terminal.' }}
      when: finder_connection_answer.rc != 0

    - name: Remember Finder connection confirmation
      ansible.builtin.include_tasks: tasks/save-wizard-answer.yml
      vars:
        wizard_answer_key: finder.time_machine_connected
        wizard_answer_value: true
