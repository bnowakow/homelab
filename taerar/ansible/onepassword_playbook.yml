- name: Install 1Password before GitHub authentication
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Install 1Password for Mac and the Mac App Store CLI
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        if [[ "$UNATTENDED" != true ]]; then unset HOMEBREW_NO_ASK; fi
        installed_casks=$(brew list --cask)
        install_desktop=false
        if [[ ! -d /Applications/1Password.app && ! -d "$HOME/Applications/1Password.app" && $'\n'"$installed_casks"$'\n' != *$'\n1password\n'* ]]; then
          install_desktop=true
        fi
        install_mas=false
        if ! command -v mas >/dev/null 2>&1; then install_mas=true; fi
        pending_formulae=
        if [[ "$install_mas" == true ]]; then
          dependencies=$(brew deps --missing --formula mas)
          installed_formulae=$(brew list --formula)
          if [[ $'\n'"$installed_formulae"$'\n' != *$'\nmas\n'* ]]; then
            pending_formulae=mas
          fi
          pending_formulae=$(printf '%s\n' "$pending_formulae" "$dependencies")
        fi
        if [[ "$install_desktop" == true ]]; then
          dependencies=$(brew deps --missing --cask 1password)
          pending_formulae=$(printf '%s\n' "$pending_formulae" "$dependencies")
          printf '1password\n' > "$STATE_DIR/onepassword-casks"
        fi
        if [[ -n "$pending_formulae" ]]; then
          {
            if [[ -f "$STATE_DIR/onepassword-formulae" ]]; then cat "$STATE_DIR/onepassword-formulae"; fi
            printf '%s\n' "$pending_formulae"
          } | sed '/^$/d' | sort -u > "$STATE_DIR/onepassword-formulae.tmp"
          mv "$STATE_DIR/onepassword-formulae.tmp" "$STATE_DIR/onepassword-formulae"
        fi
        if [[ "$install_mas" == true ]]; then
          brew install --formula mas < "$PROVISION_TTY" > "$PROVISION_TTY" 2>&1
          echo installed-mas
        fi
        if [[ "$install_desktop" == true ]]; then
          brew install --cask 1password < "$PROVISION_TTY" > "$PROVISION_TTY" 2>&1
          echo installed-desktop
        fi
      args:
        executable: /bin/bash
      environment:
        STATE_DIR: "{{ lookup('env', 'HOME') }}/.homelab-provision-state"
        UNATTENDED: "{{ provision_unattended | bool | lower }}"
        PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
        HOMEBREW_NO_ASK: "{{ '1' if provision_unattended | bool else '' }}"
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
        HOMEBREW_NO_INSTALL_UPGRADE: '1'
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      register: onepassword_install
      changed_when: "'installed-' in onepassword_install.stdout"

    - name: Install 1Password for Safari from the Mac App Store
      ansible.builtin.shell: |
        set -euo pipefail
        installed_apps=$(mas list)
        if [[ -d '/Applications/1Password for Safari.app' || -d "$HOME/Applications/1Password for Safari.app" ]] ||
           awk '$1 == "1569813296" { found=1 } END { exit !found }' <<< "$installed_apps"; then
          echo already-installed
          exit 0
        fi
        touch "$STATE_DIR/onepassword-safari-installed"
        # get acquires this free app if needed, then installs it.
        # mas 7 needs root; tasks have no terminal, so sudo asks through the askpass dialog.
        askpass=$("$ASKPASS_DIR/sudo-askpass-wrapper.sh" "$STATE_DIR" "$PROVISION_TTY")
        trap 'rm -f "$askpass"' EXIT
        SUDO_ASKPASS="$askpass" sudo -A mas get 1569813296 < "$PROVISION_TTY" > "$PROVISION_TTY" 2>&1
      args:
        executable: /bin/bash
      environment:
        STATE_DIR: "{{ lookup('env', 'HOME') }}/.homelab-provision-state"
        PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
        ASKPASS_DIR: "{{ playbook_dir }}/files"
        TERM: "{{ lookup('env', 'TERM') or 'xterm-256color' }}"
      register: safari_install
      changed_when: "'already-installed' not in safari_install.stdout"

    - name: Open 1Password for sign-in
      ansible.builtin.shell: |
        set -euo pipefail
        if pgrep -x -u "$(id -u)" 1Password >/dev/null; then
          echo already-open
          exit 0
        fi
        touch "$STATE_DIR/onepassword-opened"
        open -a 1Password
      args:
        executable: /bin/bash
      environment:
        STATE_DIR: "{{ lookup('env', 'HOME') }}/.homelab-provision-state"
      register: onepassword_open
      changed_when: "'already-open' not in onepassword_open.stdout"

    - name: Check whether 1Password can already use an SSH key
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/files/check_onepassword_readiness.py"
          - signin
      register: onepassword_signin_check
      changed_when: false

    - name: Confirm 1Password sign-in only when it cannot be verified
      ansible.builtin.shell: |
        dialog --clear --title '1Password sign-in' --defaultno \
          --yes-label 'Continue' --no-label 'Abort' \
          --yesno 'The automatic key-use check could not confirm 1Password readiness. This does not necessarily mean you are signed out.\n\nSign in to 1Password for Mac and unlock it if needed. If already signed in, continue.\n\nAre you ready for SSH agent setup?' \
          15 78 < "$PROVISION_TTY" > "$PROVISION_TTY" 2>&1
      environment:
        PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
        TERM: "{{ lookup('env', 'TERM') or 'xterm-256color' }}"
      changed_when: false
      register: onepassword_signin_answer
      when: (onepassword_signin_check.stdout | from_json).signin != 'ready' and not ((provision_saved_answers | default({})).get('onepassword.signin', false))

    - name: Remember confirmed 1Password sign-in
      ansible.builtin.include_tasks: tasks/save-wizard-answer.yml
      vars:
        wizard_answer_key: onepassword.signin
        wizard_answer_value: true
      when: not (onepassword_signin_answer.skipped | default(false))

    - name: Snapshot SSH configuration before configuring the 1Password agent
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        agent="$HOME/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
        config="$HOME/.ssh/config"
        if [[ ! -f "$config" ]]; then config=/dev/null; fi
        effective=$(ssh -F "$config" -G git@github.com 2>/dev/null | awk '$1 == "identityagent" { sub(/^[^ ]+ /, ""); print }')
        if [[ "$effective" == "$agent" ]]; then
          echo already-configured
          exit 0
        fi
        if [[ -L "$HOME/.ssh/config" ]]; then
          echo 'SSH config is a symlink. Configure IdentityAgent in its source file, then rerun provisioning.' >&2
          exit 1
        fi
        if [[ ! -d "$STATE_DIR/ssh-agent-config" ]]; then
          snapshot=$(mktemp -d "$STATE_DIR/ssh-agent-config-pending.XXXXXX")
          if [[ -f "$HOME/.ssh/config" ]]; then cp -p "$HOME/.ssh/config" "$snapshot/original"; fi
          if [[ ! -d "$HOME/.ssh" ]]; then touch "$snapshot/directory-created"; fi
          mv "$snapshot" "$STATE_DIR/ssh-agent-config"
        fi
        if [[ ! -d "$HOME/.ssh" ]]; then mkdir -m 700 "$HOME/.ssh"; fi
      args:
        executable: /bin/bash
      environment:
        STATE_DIR: "{{ lookup('env', 'HOME') }}/.homelab-provision-state"
      register: ssh_agent_config
      changed_when: "'already-configured' not in ssh_agent_config.stdout"

    - name: Configure GitHub SSH to use the 1Password agent
      ansible.builtin.blockinfile:
        path: "{{ lookup('env', 'HOME') }}/.ssh/config"
        create: true
        mode: '0600'
        insertbefore: BOF
        marker: '# {mark} HOMELAB 1PASSWORD GITHUB AGENT'
        block: |
          Host github.com
            IdentityAgent "{{ lookup('env', 'HOME') }}/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
          Host *
      when: "'already-configured' not in ssh_agent_config.stdout"

    - name: Check existing agent, GitHub SSH access, Safari extension and AutoFill state
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/files/check_onepassword_readiness.py"
          - setup
      register: onepassword_setup_check
      changed_when: false

    - name: Decide which 1Password setup steps still need confirmation
      ansible.builtin.set_fact:
        # AutoFill has its own saved-answer ID so older saved setup confirmations
        # (recorded before this check existed) cannot hide it.
        onepassword_setup_needed: >-
          {{ not ((provision_saved_answers | default({})).get('onepassword.setup', false)) and (
          (onepassword_setup_check.stdout | from_json).agent != 'ready' or
          (onepassword_setup_check.stdout | from_json).github != 'ready' or
          (onepassword_setup_check.stdout | from_json).safari != 'ready') }}
        onepassword_autofill_needed: >-
          {{ not ((provision_saved_answers | default({})).get('onepassword.autofill', false)) and
          (onepassword_setup_check.stdout | from_json).autofill != 'ready' }}

    - name: Wait for SSH agent, Safari and AutoFill setup only when not verified ready
      ansible.builtin.shell: |
        message='Only the following checks need attention:'
        if [ "$SETUP_NEEDED" != true ]; then
          AGENT_STATUS=ready GITHUB_STATUS=ready SAFARI_STATUS=ready
        fi
        if [ "$AGENT_STATUS" != ready ]; then
          message="$message\n\n1Password agent: enable Use the SSH Agent in Settings > Developer, unlock the app and make your SSH key available."
        fi
        if [ "$GITHUB_STATUS" != ready ]; then
          case "$GITHUB_REASON" in
            authentication) message="$message\n\nGitHub rejected the SSH key. Register the correct public key on GitHub and approve any 1Password request." ;;
            host_key) message="$message\n\nGitHub host authenticity has not been verified. Run ssh -T git@github.com in Terminal and verify GitHub's host fingerprint, then retry." ;;
            host_key_changed) message="$message\n\nGitHub host key changed. Stop and investigate the fingerprint mismatch before continuing; do not bypass host verification." ;;
            network) message="$message\n\nGitHub SSH could not connect. Check your network and SSH access to github.com." ;;
            timeout_or_unavailable) message="$message\n\nGitHub SSH check timed out or could not start. Approve any pending 1Password request and retry." ;;
            *) message="$message\n\nGitHub SSH authentication could not be verified. Check ssh -T git@github.com in Terminal." ;;
          esac
        fi
        if [ "$SAFARI_STATUS" != ready ]; then
          message="$message\n\nSafari extension: enable 1Password for Safari in Safari > Settings > Extensions. If already enabled, confirm it here; macOS may prevent the automatic check from reading its state."
        fi
        if [ "$AUTOFILL_NEEDED" = true ]; then
          message="$message\n\nmacOS AutoFill: in 1Password choose Set up macOS AutoFill, or open System Settings > General > AutoFill & Passwords and enable 1Password. macOS requires you to approve this yourself."
        fi
        message="$message\n\nHave you completed or confirmed the remaining steps?"
        dialog --clear --title '1Password setup' --defaultno \
          --yes-label 'Check and continue' --no-label 'Abort' \
          --yesno "$message" \
          22 80 < "$PROVISION_TTY" > "$PROVISION_TTY" 2>&1
      environment:
        PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
        TERM: "{{ lookup('env', 'TERM') or 'xterm-256color' }}"
        AGENT_STATUS: "{{ (onepassword_setup_check.stdout | from_json).agent }}"
        GITHUB_STATUS: "{{ (onepassword_setup_check.stdout | from_json).github }}"
        GITHUB_REASON: "{{ (onepassword_setup_check.stdout | from_json).github_reason }}"
        SAFARI_STATUS: "{{ (onepassword_setup_check.stdout | from_json).safari }}"
        SETUP_NEEDED: "{{ onepassword_setup_needed | bool | lower }}"
        AUTOFILL_NEEDED: "{{ onepassword_autofill_needed | bool | lower }}"
      changed_when: false
      register: onepassword_setup_answer
      when: onepassword_setup_needed | bool or onepassword_autofill_needed | bool

    - name: Remember confirmed SSH agent and Safari setup
      ansible.builtin.include_tasks: tasks/save-wizard-answer.yml
      vars:
        wizard_answer_key: onepassword.setup
        wizard_answer_value: true
      when: not (onepassword_setup_answer.skipped | default(false)) and onepassword_setup_needed | bool

    - name: Remember confirmed macOS AutoFill setup
      ansible.builtin.include_tasks: tasks/save-wizard-answer.yml
      vars:
        wizard_answer_key: onepassword.autofill
        wizard_answer_value: true
      when: not (onepassword_setup_answer.skipped | default(false)) and onepassword_autofill_needed | bool

    - name: Verify that the 1Password SSH agent offers a key
      ansible.builtin.shell: |
        if ! ssh-add -l >/dev/null 2>&1; then
          echo 'The 1Password SSH agent is unavailable or has no keys. Unlock 1Password, enable Settings > Developer > Use the SSH Agent, and make an SSH Key item available to the agent, then rerun provisioning.' >&2
          exit 1
        fi
      environment:
        SSH_AUTH_SOCK: "{{ lookup('env', 'HOME') }}/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
      changed_when: false
