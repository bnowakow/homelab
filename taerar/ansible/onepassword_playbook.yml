- name: Install 1Password before GitHub authentication
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Install 1Password for Mac and the Mac App Store CLI
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        if [[ "$UNATTENDED" != true ]]; then unset HOMEBREW_NO_ASK; fi
        installed_casks=$(brew list --cask)
        install_desktop=false
        if [[ ! -d /Applications/1Password.app && ! -d "$HOME/Applications/1Password.app" && $'\n'"$installed_casks"$'\n' != *$'\n1password\n'* ]]; then
          install_desktop=true
        fi
        install_mas=false
        if ! command -v mas >/dev/null 2>&1; then install_mas=true; fi
        pending_formulae=
        if [[ "$install_mas" == true ]]; then
          dependencies=$(brew deps --missing --formula mas)
          installed_formulae=$(brew list --formula)
          if [[ $'\n'"$installed_formulae"$'\n' != *$'\nmas\n'* ]]; then
            pending_formulae=mas
          fi
          pending_formulae=$(printf '%s\n' "$pending_formulae" "$dependencies")
        fi
        if [[ "$install_desktop" == true ]]; then
          dependencies=$(brew deps --missing --cask 1password)
          pending_formulae=$(printf '%s\n' "$pending_formulae" "$dependencies")
          printf '1password\n' > "$STATE_DIR/onepassword-casks"
        fi
        if [[ -n "$pending_formulae" ]]; then
          {
            if [[ -f "$STATE_DIR/onepassword-formulae" ]]; then cat "$STATE_DIR/onepassword-formulae"; fi
            printf '%s\n' "$pending_formulae"
          } | sed '/^$/d' | sort -u > "$STATE_DIR/onepassword-formulae.tmp"
          mv "$STATE_DIR/onepassword-formulae.tmp" "$STATE_DIR/onepassword-formulae"
        fi
        if [[ "$install_mas" == true ]]; then
          brew install --formula mas < "$PROVISION_TTY" > "$PROVISION_TTY" 2>&1
          echo installed-mas
        fi
        if [[ "$install_desktop" == true ]]; then
          brew install --cask 1password < "$PROVISION_TTY" > "$PROVISION_TTY" 2>&1
          echo installed-desktop
        fi
      args:
        executable: /bin/bash
      environment:
        STATE_DIR: "{{ lookup('env', 'HOME') }}/.homelab-provision-state"
        UNATTENDED: "{{ provision_unattended | bool | lower }}"
        PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
        HOMEBREW_NO_ASK: "{{ '1' if provision_unattended | bool else '' }}"
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
        HOMEBREW_NO_INSTALL_UPGRADE: '1'
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      register: onepassword_install
      changed_when: "'installed-' in onepassword_install.stdout"

    - name: Install 1Password for Safari from the Mac App Store
      ansible.builtin.shell: |
        set -euo pipefail
        installed_apps=$(mas list)
        if [[ -d '/Applications/1Password for Safari.app' || -d "$HOME/Applications/1Password for Safari.app" ]] ||
           awk '$1 == "1569813296" { found=1 } END { exit !found }' <<< "$installed_apps"; then
          echo already-installed
          exit 0
        fi
        touch "$STATE_DIR/onepassword-safari-installed"
        # get acquires this free app if needed, then installs it.
        mas get 1569813296 < "$PROVISION_TTY" > "$PROVISION_TTY" 2>&1
      args:
        executable: /bin/bash
      environment:
        STATE_DIR: "{{ lookup('env', 'HOME') }}/.homelab-provision-state"
        PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
      register: safari_install
      changed_when: "'already-installed' not in safari_install.stdout"

    - name: Explain the remaining 1Password setup
      ansible.builtin.debug:
        msg: >-
          Sign in to 1Password for Mac. In Safari > Settings > Extensions, enable
          1Password for Safari and approve the requested website permissions.
          Apple Account and 1Password authentication cannot be auto-approved,
          including with --unattended.
