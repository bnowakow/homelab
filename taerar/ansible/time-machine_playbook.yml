- name: Choose new computer setup or existing computer restoration
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    time_machine_volume: /Volumes/time-machine
  tasks:
    - name: List the computers and versions available on the Time Machine share
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/files/list_time_machine_computers.py"
          - "{{ time_machine_volume }}"
      register: time_machine_inventory
      changed_when: false

    - name: Ask whether to create a new computer or restore an existing computer
      ansible.builtin.shell: |
        dialog --clear --stdout --no-collapse --cr-wrap --tab-len 4 \
          --title 'Time Machine computers' \
          --ok-label 'Select' --cancel-label 'Abort' --default-button cancel \
          --menu "Computers on the Time Machine share:\n\n$COMPUTER_LIST\n\nChoose what you want to do:" \
          0 0 2 \
          1 'Create a new computer (new computer or new version of existing computer)' \
          2 'Restore existing computer' \
          < "$PROVISION_TTY" 2> "$PROVISION_TTY"
      environment:
        COMPUTER_LIST: "{{ (time_machine_inventory.stdout | from_json).display }}"
        PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
        TERM: "{{ lookup('env', 'TERM') or 'xterm-256color' }}"
      register: time_machine_selection
      changed_when: false

    - name: Validate the selected action
      ansible.builtin.assert:
        that: time_machine_selection.stdout | trim in ['1', '2']
        fail_msg: No valid Time Machine action was selected.

    - name: Keep the selection available for subsequent setup steps
      ansible.builtin.set_fact:
        time_machine_action: "{{ 'create' if time_machine_selection.stdout | trim == '1' else 'restore' }}"
        time_machine_computers: "{{ (time_machine_inventory.stdout | from_json).computers }}"
