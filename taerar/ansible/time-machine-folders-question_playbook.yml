- name: Ask which home folders to copy from the selected backup (the copy itself runs last)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    time_machine_volume: /Volumes/time-machine
    # PROD copies the chosen folders; TEST copies only the first file of each.
    folders_env: "{{ provision_env | default('PROD') }}"
    folders_source_bundle: >-
      {{ time_machine_volume }}/{{ time_machine_computer | default('') }}{{
      '' if (time_machine_copy_from | default('none')) == 'unversioned'
      else ' ' + (time_machine_copy_from | default('none') | string) }}.sparsebundle
  pre_tasks:
    # Asked only after the wizard has a copy source; never for cancelled or
    # TODO paths, and never when the user chose to start with an empty backup.
    - name: Skip unless a backup to copy data from was selected
      ansible.builtin.meta: end_play
      when: >-
        (time_machine_action | default('cancelled')) != 'create' or
        (time_machine_copy_from | default(none)) in [none, 'none'] or
        (time_machine_saved_cancelled | default(false))

    # The user chose "Continue without" in full-disk-access_playbook.yml.
    - name: Explain that home folders are not copied without Full Disk Access
      ansible.builtin.debug:
        msg: >-
          Skipped copying home folders (it would run last): {{ full_disk_access_app | default('the terminal app') }}
          has no Full Disk Access. Enable it, quit and reopen the app, then rerun
          provisioning to copy them. Your saved answers are unchanged.
      when: not (provision_full_disk_access | default(true) | bool)

    - name: Skip the folders copy without Full Disk Access
      ansible.builtin.meta: end_play
      when: not (provision_full_disk_access | default(true) | bool)
  tasks:
    - name: Validate the provisioning environment
      ansible.builtin.assert:
        that: folders_env in ['PROD', 'TEST']
        fail_msg: HOMELAB_PROVISION_ENV must be PROD or TEST.

    - name: Ask which home folders to copy from the selected backup
      ansible.builtin.shell: |
        if [ "$FOLDERS_ENV" = TEST ]; then
          scope='TEST environment: only the first file of each selected folder is copied.'
        else
          scope='Everything in each selected folder is copied.'
        fi
        message="Select the home folders to copy from the latest backup in $SOURCE_NAME into this Mac (Space toggles, Enter confirms).\n\n$scope Existing files are never overwritten and the backup is only read.\n\nThe copy runs at the very end, after everything else, because it can take a long time. Progress is shown, and an interrupted copy resumes when you rerun provisioning.\n\nThe terminal running provisioning needs Full Disk Access (System Settings > Privacy & Security > Full Disk Access)."
        dialog --clear --stdout --separate-output --cr-wrap --title 'Copy folders from backup' \
          --ok-label Continue --cancel-label Abort --default-button cancel \
          --checklist "$message" 24 80 10 \
          Documents '~/Documents' on \
          Downloads '~/Downloads' on \
          Movies '~/Movies' on \
          Music '~/Music (includes the Music app library)' on \
          Pictures '~/Pictures' on \
          Desktop '~/Desktop' off \
          code '~/code (projects; existing folders are kept)' on \
          Sync '~/Sync (Syncthing folder)' off \
          go '~/go (Go workspace)' off \
          Public '~/Public' off \
          < "$PROVISION_TTY" 2> "$PROVISION_TTY"
      args:
        executable: /bin/bash
      environment:
        FOLDERS_ENV: "{{ folders_env }}"
        SOURCE_NAME: "{{ folders_source_bundle | basename | regex_replace('\\.sparsebundle$', '') }}"
        PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
        TERM: "{{ lookup('env', 'TERM') or 'xterm-256color' }}"
        DIALOG_ERROR: '70'
        DIALOG_CANCEL: '1'
        DIALOG_ESC: '255'
      register: folders_answer
      changed_when: false
      failed_when: false
      when: "'time_machine.folders' not in (provision_saved_answers | default({}))"

    - name: Stop after Abort or a dialog failure
      ansible.builtin.fail:
        msg: >-
          {{ 'Choosing folders cancelled. Nothing was copied; earlier provisioning steps remain applied.'
             if folders_answer.rc in [1, 255] else
             'Could not show the folders dialog. Run provisioning from an interactive Terminal.' }}
      when: not (folders_answer.skipped | default(false)) and folders_answer.rc != 0

    - name: Decide which folders to copy
      ansible.builtin.set_fact:
        time_machine_copy_folders: >-
          {{ (provision_saved_answers['time_machine.folders'] | default([]))
             if (folders_answer.skipped | default(false)) else (folders_answer.stdout_lines | list) }}

    - name: Validate the folders choice
      ansible.builtin.assert:
        that: time_machine_copy_folders | difference(['Documents', 'Downloads', 'Movies', 'Music', 'Pictures', 'Desktop', 'code', 'Sync', 'go', 'Public']) | length == 0
        fail_msg: An unknown home folder was selected.

    - name: Remember the folders choice
      ansible.builtin.include_tasks: tasks/save-wizard-answer.yml
      vars:
        wizard_answer_key: time_machine.folders
        wizard_answer_value: "{{ time_machine_copy_folders }}"
      when: not (folders_answer.skipped | default(false))
