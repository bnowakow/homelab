- name: Ask whether to copy keychains, Safari, Messages and Mail data from the selected backup
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    time_machine_volume: /Volumes/time-machine
    # PROD copies Keychains, Safari, Messages and Mail data; TEST copies one file.
    files_env: "{{ provision_env | default('PROD') }}"
    files_source_bundle: >-
      {{ time_machine_volume }}/{{ time_machine_computer | default('') }}{{
      '' if (time_machine_copy_from | default('none')) == 'unversioned'
      else ' ' + (time_machine_copy_from | default('none') | string) }}.sparsebundle
  pre_tasks:
    # Asked only after the wizard has a copy source; never for cancelled or
    # TODO paths, and never when the user chose to start with an empty backup.
    - name: Skip unless a backup to copy data from was selected
      ansible.builtin.meta: end_play
      when: >-
        (time_machine_action | default('cancelled')) != 'create' or
        (time_machine_copy_from | default(none)) in [none, 'none'] or
        (time_machine_saved_cancelled | default(false))

    # The user chose "Continue without" in full-disk-access_playbook.yml.
    - name: Explain that private data are not copied without Full Disk Access
      ansible.builtin.debug:
        msg: >-
          Skipped copying private data: {{ full_disk_access_app | default('the terminal app') }}
          has no Full Disk Access. Enable it, quit and reopen the app, then rerun
          provisioning to copy them. Your saved answers are unchanged.
      when: not (provision_full_disk_access | default(true) | bool)

    - name: Skip the private data copy without Full Disk Access
      ansible.builtin.meta: end_play
      when: not (provision_full_disk_access | default(true) | bool)
  tasks:
    - name: Validate the provisioning environment
      ansible.builtin.assert:
        that: files_env in ['PROD', 'TEST']
        fail_msg: HOMELAB_PROVISION_ENV must be PROD or TEST.

    - name: Ask whether to copy keychains, Safari, Messages and Mail data
      ansible.builtin.shell: |
        if [ "$FILES_ENV" = TEST ]; then
          scope='TEST environment: only the first file found is copied.'
        else
          scope='Copies ~/Library/Keychains, Safari (history, bookmarks), Messages (chat history and attachments) and Mail (messages and mail settings). This is sensitive data and Mail/Messages can be many GB. Safari, Mail and Messages must be closed.'
        fi
        message="Copy private data from the latest backup in $SOURCE_NAME into this Mac?\n\n$scope Existing files are never overwritten (so a keychain or database this Mac already created is kept, and only missing files are added), and the backup is only read.\n\nThe terminal running provisioning needs Full Disk Access (System Settings > Privacy & Security > Full Disk Access) to read backup contents."
        dialog --clear --stdout --cr-wrap --title 'Copy private data from backup' \
          --ok-label Continue --cancel-label Abort --default-button cancel \
          --menu "$message" 18 80 2 \
          copy "Copy keychains, Safari, Messages and Mail from $SOURCE_NAME" \
          skip 'Do not copy private data' \
          < "$PROVISION_TTY" 2> "$PROVISION_TTY"
      args:
        executable: /bin/bash
      environment:
        FILES_ENV: "{{ files_env }}"
        SOURCE_NAME: "{{ files_source_bundle | basename | regex_replace('\\.sparsebundle$', '') }}"
        PROVISION_TTY: "{{ lookup('env', 'HOMELAB_PROVISION_TTY') }}"
        TERM: "{{ lookup('env', 'TERM') or 'xterm-256color' }}"
        DIALOG_ERROR: '70'
        DIALOG_CANCEL: '1'
        DIALOG_ESC: '255'
      register: files_answer
      changed_when: false
      failed_when: false
      when: "'time_machine.private_data' not in (provision_saved_answers | default({}))"

    - name: Stop after Abort or a dialog failure
      ansible.builtin.fail:
        msg: >-
          {{ 'Copying private data cancelled. Nothing was copied; earlier provisioning steps remain applied.'
             if files_answer.rc in [1, 255] else
             'Could not show the private data dialog. Run provisioning from an interactive Terminal.' }}
      when: not (files_answer.skipped | default(false)) and files_answer.rc != 0

    - name: Decide whether to copy private data
      ansible.builtin.set_fact:
        time_machine_copy_files: >-
          {{ (provision_saved_answers['time_machine.private_data'] | default('skip'))
             if (files_answer.skipped | default(false)) else files_answer.stdout }}

    - name: Validate the private data choice
      ansible.builtin.assert:
        that: time_machine_copy_files in ['copy', 'skip']
        fail_msg: No valid private data copy choice was selected.

    - name: Remember the private data choice
      ansible.builtin.include_tasks: tasks/save-wizard-answer.yml
      vars:
        wizard_answer_key: time_machine.private_data
        wizard_answer_value: "{{ time_machine_copy_files }}"
      when: not (files_answer.skipped | default(false))
