- name: Install Prezto for sup on proxmox5
  hosts: proxmox5.localdomain.bnowakowski.pl
  remote_user: sup
  become: false
  tasks:
    - name: Ensure Zsh is installed
      ansible.builtin.apt:
        name: zsh
        state: present
      become: true

    - name: Install and update Prezto using the shared role
      ansible.builtin.import_role:
        name: "{{ playbook_dir }}/../../ansible/roles/prezto"
      vars:
        prezto_update_existing: true
        prezto_remove_legacy_path_block: true

    - name: Set Zsh as sup's login shell
      ansible.builtin.user:
        name: sup
        shell: /usr/bin/zsh
      become: true
