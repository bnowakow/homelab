authelia:
  authentication_backend:
    password_reset:
      disable: true
    file:
      path: /config/users_database.yaml
  access_control:
    default_policy: deny
    rules:
      - domain: '*.rancher.tailscale.bnowakowski.pl'
        policy: two_factor
      - domain: '*.rancher.localdomain.bnowakowski.pl'
        policy: two_factor
  session:
    cookies:
      - domain: rancher.tailscale.bnowakowski.pl
        authelia_url: https://authelia.rancher.tailscale.bnowakowski.pl
      - domain: rancher.localdomain.bnowakowski.pl
        authelia_url: https://authelia.rancher.localdomain.bnowakowski.pl
  storage:
    local:
      path: /config/db.sqlite3
  notifier:
    filesystem:
      filename: /config/notification.txt

# A single instance owns the SQLite database and in-memory sessions.
workload:
  main:
    replicas: 1
    strategy: Recreate
    podSpec:
      initContainers:
        seed-users:
          enabled: true
          type: init
          imageSelector: image
          command:
            - /bin/sh
            - -ec
          args:
            - |
              # Seed once; never replace passwords saved by Authelia.
              if [ ! -e /config/users_database.yaml ]; then
                umask 077
                cp /users/users_database.yaml /config/users_database.yaml.seed
                chmod 600 /config/users_database.yaml.seed
                mv /config/users_database.yaml.seed /config/users_database.yaml
              fi
      containers:
        main:
          env:
            AUTHELIA_SESSION_SECRET:
              secretKeyRef:
                name: authelia-secrets
                expandObjectName: false
                key: session-secret
            AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET:
              secretKeyRef:
                name: authelia-secrets
                expandObjectName: false
                key: jwt-secret
            AUTHELIA_STORAGE_ENCRYPTION_KEY:
              secretKeyRef:
                name: authelia-secrets
                expandObjectName: false
                key: storage-encryption-key
            AUTHELIA_STORAGE_POSTGRES_ADDRESS: null
            AUTHELIA_STORAGE_POSTGRES_DATABASE: null
            AUTHELIA_STORAGE_POSTGRES_USERNAME: null
            AUTHELIA_STORAGE_POSTGRES_PASSWORD: null
            AUTHELIA_SESSION_REDIS_HOST: null
            AUTHELIA_SESSION_REDIS_PORT: null
            AUTHELIA_SESSION_REDIS_DATABASE_INDEX: null
            AUTHELIA_SESSION_REDIS_PASSWORD: null

dependencies:
  postgresql:
    # Chart 35 uses dependency switches instead of cnpg.main/redis.
    # Keep the existing SQLite database and in-memory sessions.
    enabled: false
  valkey:
    enabled: false

persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: authelia-config-longhorn-rwo
    mountPath: /config
    targetSelector:
      main:
        main: {}
        seed-users: {}
  users:
    enabled: true
    type: secret
    objectName: authelia-users
    expandObjectName: false
    mountPath: /users
    readOnly: true
    targetSelector:
      main:
        seed-users: {}

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: authelia.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: authelia.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true
