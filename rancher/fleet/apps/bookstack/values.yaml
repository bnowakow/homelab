# Live container configuration was preserved and migrated to Longhorn.
# Claims are managed by the separate storage bundle.
# Retain the replacement database claim during recovery, without mounting it.
# Keep this object until the recovered database and any newer writes are checked.
extraTpl:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: bookstack-mariadb-data
      namespace: apps-bookstack
      annotations:
        helm.sh/resource-policy: keep
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: local-path
      volumeName: pvc-d0b3aaa0-725a-477c-947c-131b5637090d
      resources:
        requests:
          storage: 100Gi

persistence:
  config:
    enabled: true
    type: pvc
    mountPath: /config
    existingClaim: bookstack-config-longhorn-rwo

# Keep the database claim externally managed by the storage bundle.
mariadb:
  workload:
    main:
      replicas: 1
      strategy: Recreate
  persistence:
    data:
      enabled: true
      type: pvc
      existingClaim: bookstack-mariadb-data-longhorn-rwo

workload:
  main:
    strategy: Recreate
    replicas: 1
    podSpec:
      containers:
        main:
          env:
            # Preserve the original encryption key across chart reconciliations.
            APP_KEY:
              secretKeyRef:
                name: bookstack-preserved-app-key
                expandObjectName: false
                key: APP_KEY
            APP_URL: https://bookstack.rancher.tailscale.bnowakowski.pl/
            # Keep the deployed Secret references to avoid Helm retaining a
            # stale valueFrom when patching these environment variables.
            DB_HOST:
              secretKeyRef:
                name: bookstack-mariadbcreds
                expandObjectName: false
                key: plainhost
            DB_PASSWORD:
              secretKeyRef:
                name: bookstack-mariadbcreds
                expandObjectName: false
                key: mariadb-password

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: bookstack.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true
