name: bookstack
defaultNamespace: apps-bookstack

dependsOn:
  - name: longhorn-bookstack-storage

helm:
  chart: oci://oci.trueforge.org/truecharts/bookstack
  # Recovery: chart 24 replaces the database backend and ignores mariadb values.
  # Keep the original Longhorn database and compatible image/layout.
  version: 23.2.3
  releaseName: bookstack
  waitForJobs: true
  valuesFiles:
    - values.yaml
