name: piwigo
defaultNamespace: apps-piwigo
dependsOn:
- name: piwigo-storage
helm:
  chart: oci://oci.trueforge.org/truecharts/piwigo
  # Recovery: 23.0.0 replaced MariaDB 13.1.1 with an empty 11.8.6 instance.
  # Keep the known original image/layout until a logical migration is validated.
  version: 22.3.2
  releaseName: piwigo
  waitForJobs: true
  valuesFiles:
  - values.yaml
  # Initial admin login (piwigo.admin_user/admin_pass/admin_email), created by
  # hand so the password is not in git. See README.md.
  valuesFrom:
  - secretKeyRef:
      name: piwigo-values
      namespace: apps-piwigo
      key: values.yaml
