persistence:
  appdata:
    enabled: true
    existingClaim: youtubedl-material-appdata-longhorn-rwo
    mountPath: /app/appdata
  audio:
    enabled: true
    mountPath: /app/audio
    path: /mnt/MargokPool/archive/Data/rancher/youtubedl-material/audio
    server: nas.localdomain.bnowakowski.pl
    type: nfs
  subscriptions:
    enabled: true
    mountPath: /app/subscriptions
    path: /mnt/MargokPool/archive/Data/rancher/youtubedl-material/subscriptions
    server: nas.localdomain.bnowakowski.pl
    type: nfs
  users:
    enabled: true
    existingClaim: youtubedl-material-users-longhorn-rwo
    mountPath: /app/users
  video:
    enabled: true
    mountPath: /app/video
    path: /mnt/MargokPool/archive/Data/rancher/youtubedl-material/video
    server: nas.localdomain.bnowakowski.pl
    type: nfs
resources:
  limits:
    cpu: 200m
    memory: 14Gi
  requests:
    cpu: 60m
    memory: 4Gi
workload:
  main:
    replicas: 1
    strategy: Recreate
    podSpec:
      containers:
        main:
          fixedEnv:
            PUID: '568'
          probes:
            startup:
              enabled: true
              spec:
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 180
                successThreshold: 1
            liveness:
              enabled: true
              spec:
                initialDelaySeconds: 60
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 5
                successThreshold: 1
security:
  PUID: 568
securityContext:
  container:
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
  pod:
    fsGroup: 568
ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
    - host: youtubedl-material.rancher.tailscale.bnowakowski.pl
      paths:
      - path: /
        pathType: Prefix
    - host: youtubedl-material.rancher.localdomain.bnowakowski.pl
      paths:
      - path: /
        pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
        - websecure
        forceTLS: true
mongodb:
  persistence:
    data:
      existingClaim: youtubedl-material-mongodb-data-longhorn-rwo
  workload:
    main:
      replicas: 1
      strategy: Recreate
