persistence:
  config:
    existingClaim: sonarr-config-longhorn-rwo
  plex-nfs-persistence:
    enabled: true
    path: /mnt/PlexPool/plex
    server: nas.localdomain.bnowakowski.pl
    type: nfs
    targetSelector:
      main:
        main:
          mountPath: /mnt/PlexPool/plex
resources:
  limits:
    cpu: 12000m
  requests:
    cpu: 30m
TZ: Europe/Warsaw
metrics:
  main:
    enabled: false
ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
    - host: sonarr.rancher.tailscale.bnowakowski.pl
      paths:
      - path: /
        pathType: Prefix
    - host: sonarr.rancher.localdomain.bnowakowski.pl
      paths:
      - path: /
        pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
        - websecure
        forceTLS: true
workload:
  main:
    replicas: 1
    strategy: Recreate
    podSpec:
      containers:
        main:
          env:
            SONARR__SERVER__TRUSTEDNETWORKS: 10.42.0.0/24,10.42.2.0/24
            SONARR__AUTH__REQUIRED: Enabled
